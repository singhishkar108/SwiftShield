# ==============================
# 🔹 SONARCLOUD PROJECT SETTINGS
# ==============================
sonar.organization=your_organization_key_here
sonar.projectKey=your_project_key_here
sonar.projectName=Your_Project_Name
sonar.sourceEncoding=UTF-8

# ==============================
# 🔹 SOURCE CODE LOCATIONS
# ==============================
# Backend (Express API) and Frontend (React)
sonar.sources=PaymentPortal/backend/src,PaymentPortal/frontend/src

# ==============================
# 🔹 TEST LOCATIONS
# ==============================
sonar.tests=PaymentPortal/backend/tests

# ==============================
# 🔹 EXCLUSIONS
# ==============================
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/bin/**,**/obj/**

# ==============================
# 🔹 COVERAGE (for Jest)
# ==============================
sonar.javascript.lcov.reportPaths=PaymentPortal/frontend/coverage/lcov.info,PaymentPortal/backend/coverage/lcov.info